ngs you here to continue.</text><rect x="40" y="824" width="110" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="95" y="857" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#222">Back</text><rect x="164" y="824" width="234" height="56" rx="10" fill="#bbb" stroke="#222" stroke-width="2"/><text x="281" y="857" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#222">Continue</text></g>
