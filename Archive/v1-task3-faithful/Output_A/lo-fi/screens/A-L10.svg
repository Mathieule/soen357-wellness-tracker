ght="52" rx="10" fill="#bbb" stroke="#222" stroke-width="2"/><text x="303.5" y="685" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#222">Save sleep</text></g>
