ont-size="18" font-family="Arial">›</text><rect x="40" y="654" width="358" height="52" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><rect x="52" y="666" width="161.1" height="10" fill="#777"/><rect x="52" y="684" width="232.70000000000002" height="8" fill="#aaa"/><text x="378" y="686" font-size="18" font-family="Arial">›</text><rect x="40" y="714" width="358" height="52" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><rect x="52" y="726" width="161.1" height="10" fill="#777"/><rect x="52" y="744" width="232.70000000000002" height="8" fill="#aaa"/><text x="378" y="746" font-size="18" font-family="Arial">›</text><rect x="24" y="836" width="390" height="72" fill="#cfcfcf" stroke="#222" stroke-width="1.5"/><rect x="49" y="846" width="28" height="24" fill="#fff" stroke="#222"/><text x="63" y="890" font-size="13" font-family="Arial, sans-serif"  text-anchor="middle" fill="#222">Home</text><rect x="127" y="846" width="28" height="24" fill="#fff" stroke="#222"/><text x="141" y="890" font-size="13" font-family="Arial, sans-serif"  text-anchor="middle" fill="#222">Nutrition</text><rect x="205" y="846" width="28" height="24" fill="#fff" stroke="#222"/><text x="219" y="890" font-size="13" font-family="Arial, sans-serif"  text-anchor="middle" fill="#222">Fitness</text><rect x="283" y="846" width="28" height="24" fill="#222" stroke="#222"/><text x="297" y="890" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#222">Sleep</text><rect x="361" y="846" width="28" height="24" fill="#fff" stroke="#222"/><text x="375" y="890" font-size="13" font-family="Arial, sans-serif"  text-anchor="middle" fill="#222">Profile</text><rect x="24" y="64" width="390" height="844" fill="#000" opacity="0.35"/><rect x="40" y="174" width="358" height="560" rx="14" fill="#fafafa" stroke="#222" stroke-width="2.5"/><text x="54" y="202" font-size="18" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">Add sleep / Edi