<g clip-path="none"><text x="40" y="154" font-size="24" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">Welcome to Wellness Tracker</text><text x="40" y="194" font-size="16" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">Log in, or create a new account to</text><text x="40" y="214" font-size="16" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">get started.</text><text x="40" y="254" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">Email</text><rect x="40" y="262" width="358" height="44" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="40" y="344" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">Password</text><rect x="40" y="352" width="358" height="44" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="40" y="424" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">At least 8 characters, with a</text><text x="40" y="441" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">letter and a number.</text><rect x="40" y="454" width="358" height="56" rx="10" fill="#bbb" stroke="#222" stroke-width="2"/><text x="219" y="487" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#222">Log in</text><rect x="40" y="524" width="358" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="219" y="557" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#222">Create account</text><rect x="40" y="604" width="358" height="48" rx="8" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="2 3"/><text x="52" y="624" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">(!) Error: email or password is incorrect / email</text><text x="52" y="641" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">already used</text><rect x="40" y="684" width="358" height="80" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/><text x="52" y="706" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">Prototype note: demo account</text></g>
<circle cx="394" cy="240" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="394" y="244.5" font-size="12" font-weight="bold" font-family="Arial" text-anchor="middle" fill="#222">1</text><text x="438" y="80" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">1 Focus starts in Email, then</text><text x="438" y="97" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">Password</text><circle cx="394" cy="458" r="11" fill="#222" stroke="#222" stroke-width="1.5"/><text x="394" y="462.5" font-size="12" font-weight="bold" font-family="Arial" text-anchor="middle" fill="#fff">2</text><text x="438" y="126" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">2 → Dashboard</text><circle cx="394" cy="528" r="11" fill="#222" stroke="#222" stroke-width="1.5"/><text x="394" y="532.5" font-size="12" font-weight="bold" font-family="Arial" text-anchor="middle" fill="#fff">3</text><text x="438" y="155" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">3 → Questionnaire Q1</text><circle cx="394" cy="608" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="394" y="612.5" font-size="12" font-weight="bold" font-family="Arial" text-anchor="middle" fill="#222">4</text><text x="438" y="184" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">4 Shown on wrong login or</text><text x="438" y="201" font-size="13" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">existing email</text>
<text x="24" y="948" font-size="14" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">• Already logged-in users skip this page and land on the dashboard.</text>
