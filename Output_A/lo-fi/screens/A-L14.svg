Arial" text-anchor="middle" fill="#fff">6</text><text x="438" y="242" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">6 → Nav bar: Home, Nutrition,</text><text x="438" y="259" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#222">Fitness, Sleep</text>
<text x="24" y="948" font-size="14" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">• &quot;Log out&quot; sits above the lower bar. Every save asks for confirmation, then</text><text x="24" y="966" font-size="14" font-family="Arial, sans-serif"  text-anchor="start" fill="#222">shows a success message.</text>
